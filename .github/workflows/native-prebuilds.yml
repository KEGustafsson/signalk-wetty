name: Native node-pty prebuilds

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version used to build the native addon
        required: true
        default: '26.5.0'
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-arm
            runner: ubuntu-24.04
            docker_platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify repository checkout
        run: |
          pwd
          ls -la
          test -f package.json

      - uses: docker/setup-qemu-action@v3
        if: ${{ matrix.docker_platform }}

      - uses: actions/setup-node@v4
        if: ${{ !matrix.docker_platform }}
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install native build tools
        if: ${{ !matrix.docker_platform }}
        run: sudo apt-get update && sudo apt-get install -y python3 make g++ build-essential

      - name: Install dependencies
        if: ${{ !matrix.docker_platform }}
        run: npm install --include=optional

      - name: Build node-pty prebuild
        if: ${{ !matrix.docker_platform }}
        run: npm run build:node-pty-prebuild

      - name: Build node-pty prebuild in armv7 container
        if: ${{ matrix.docker_platform }}
        run: |
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            -v "$PWD:/work" \
            -w /work \
            node:${{ inputs.node-version }}-bookworm \
            bash -lc "apt-get update && apt-get install -y python3 make g++ build-essential && npm install --include=optional && npm run build:node-pty-prebuild"

      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: node-pty-${{ matrix.platform }}
          path: native-prebuilds/${{ matrix.platform }}/pty.node
          if-no-files-found: error

  commit-prebuilds:
    name: Commit and publish prebuilds
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download linux-x64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: node-pty-linux-x64
          path: native-prebuilds/linux-x64

      - name: Download linux-arm64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: node-pty-linux-arm64
          path: native-prebuilds/linux-arm64

      - name: Download linux-arm prebuild
        uses: actions/download-artifact@v4
        with:
          name: node-pty-linux-arm
          path: native-prebuilds/linux-arm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Commit prebuilds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-prebuilds/linux-x64/pty.node native-prebuilds/linux-arm64/pty.node native-prebuilds/linux-arm/pty.node
          if git diff --cached --quiet; then
            echo "No prebuild changes to commit."
          else
            git commit -m "Add node-pty Linux prebuilds"
            git push
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@kegustafsson:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm pkg set name=@kegustafsson/signalk-wetty
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm publish --access public

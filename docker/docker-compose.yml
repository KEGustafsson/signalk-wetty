# Local integration environment for signalk-wetty.
#
#   npm run docker:up      build and start
#   npm run docker:down    stop and remove
#
# Signal K admin UI  http://localhost:3000  (Webapps -> WeTTY Terminal)
# Terminal directly  http://localhost:3001
# Credentials        sailor / signalk
#
# Deliberately stateless: every `up --build` starts from the freshly built
# plugin, so a stale volume can never mask a change.

services:
  signalk:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SIGNALK_VERSION: ${SIGNALK_VERSION:-latest}
    image: signalk-wetty-test
    ports:
      - '3000:3000'
      - '3001:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0: 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

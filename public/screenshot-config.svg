<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="signalk-wetty plugin configuration screen">
  <rect width="960" height="600" fill="#f5f6f8"/>
  <rect x="0" y="0" width="960" height="52" fill="#20364b"/>
  <text x="24" y="32" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff">Signal K · Server → Plugin Config</text>

  <rect x="24" y="76" width="912" height="500" rx="8" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="48" y="112" font-family="system-ui, sans-serif" font-size="18" fill="#20364b" font-weight="600">WeTTY Terminal</text>
  <text x="48" y="136" font-family="system-ui, sans-serif" font-size="13" fill="#6b7684">Runs a WeTTY web terminal inside the Signal K server and publishes it as an admin UI webapp.</text>

  <rect x="48" y="156" width="60" height="26" rx="13" fill="#28c840"/>
  <circle cx="95" cy="169" r="10" fill="#ffffff"/>
  <text x="120" y="174" font-family="system-ui, sans-serif" font-size="13" fill="#20364b">Enabled</text>

  <text x="48" y="212" font-family="system-ui, sans-serif" font-size="12" fill="#6b7684">Active: Terminal on http://&lt;server&gt;:3001/ — ssh to localhost:22</text>

  <g font-family="system-ui, sans-serif" font-size="13">
    <text x="48" y="256" fill="#20364b">Connection mode</text>
    <rect x="48" y="266" width="400" height="34" rx="4" fill="#fbfcfd" stroke="#dfe3e8"/>
    <text x="60" y="288" fill="#20364b">ssh</text>

    <text x="496" y="256" fill="#20364b">Command</text>
    <rect x="496" y="266" width="392" height="34" rx="4" fill="#fbfcfd" stroke="#dfe3e8"/>
    <text x="508" y="288" fill="#20364b">login</text>

    <text x="48" y="332" fill="#20364b">Terminal port</text>
    <rect x="48" y="342" width="400" height="34" rx="4" fill="#fbfcfd" stroke="#dfe3e8"/>
    <text x="60" y="364" fill="#20364b">3001</text>

    <text x="496" y="332" fill="#20364b">Bind address</text>
    <rect x="496" y="342" width="392" height="34" rx="4" fill="#fbfcfd" stroke="#dfe3e8"/>
    <text x="508" y="364" fill="#20364b">0.0.0.0</text>

    <rect x="48" y="404" width="18" height="18" rx="3" fill="#20364b"/>
    <path d="M52 413 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="418" fill="#20364b">Allow embedding in an iframe</text>

    <text x="48" y="462" fill="#20364b" font-weight="600">SSH</text>
    <rect x="48" y="474" width="840" height="1" fill="#dfe3e8"/>
    <text x="48" y="504" fill="#6b7684">SSH host</text>
    <text x="180" y="504" fill="#20364b">localhost</text>
    <text x="48" y="530" fill="#6b7684">SSH port</text>
    <text x="180" y="530" fill="#20364b">22</text>
    <text x="48" y="556" fill="#6b7684">SSH user</text>
    <text x="180" y="556" fill="#9aa0a6">(prompt on every connection)</text>
  </g>

  <rect x="756" y="520" width="132" height="36" rx="4" fill="#20364b"/>
  <text x="822" y="543" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff">Submit</text>
</svg>
